<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fan</title>
  <meta name="description" content="Steady fan noise for sleeping.">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <button id="power" class="power" aria-pressed="false" aria-label="Turn fan on">
      <svg class="blades" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="currentColor">
          <path d="M50 50 C44 34 42 18 52 10 C62 4 70 16 62 30 C58 38 54 44 50 50Z"/>
          <path d="M50 50 C44 34 42 18 52 10 C62 4 70 16 62 30 C58 38 54 44 50 50Z" transform="rotate(120 50 50)"/>
          <path d="M50 50 C44 34 42 18 52 10 C62 4 70 16 62 30 C58 38 54 44 50 50Z" transform="rotate(240 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="7" fill="currentColor"/>
      </svg>
    </button>
    <p id="status" class="status" aria-live="polite">Tap to turn on</p>

    <section class="group" aria-labelledby="speed-label">
      <h2 id="speed-label">Speed</h2>
      <div class="segmented" role="radiogroup" aria-labelledby="speed-label">
        <button role="radio" data-speed="1" aria-checked="false">Low</button>
        <button role="radio" data-speed="2" aria-checked="true">Medium</button>
        <button role="radio" data-speed="3" aria-checked="false">High</button>
      </div>
    </section>

    <section class="group" id="volume-group" aria-labelledby="volume-label">
      <h2 id="volume-label">Volume</h2>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-labelledby="volume-label">
    </section>
    <p id="volume-hint" class="hint" hidden>Use your phone's volume buttons to change the volume.</p>

    <section class="group" aria-labelledby="timer-label">
      <h2 id="timer-label">Sleep timer</h2>
      <div class="segmented" role="radiogroup" aria-labelledby="timer-label">
        <button role="radio" data-minutes="0" aria-checked="true">Off</button>
        <button role="radio" data-minutes="30" aria-checked="false">30m</button>
        <button role="radio" data-minutes="60" aria-checked="false">1h</button>
        <button role="radio" data-minutes="120" aria-checked="false">2h</button>
        <button role="radio" data-minutes="480" aria-checked="false">8h</button>
      </div>
      <p id="timer-left" class="hint"></p>
    </section>
  </main>

  <audio id="audio" loop preload="auto" playsinline></audio>
  <script src="app.js"></script>
</body>
</html>
